name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DSH_DESKTOP_HOME: ${{ runner.temp }}/dsh-desktop-tests
  DSH_HOME: ${{ runner.temp }}/dsh-home-tests
  DSH_DESKTOP_SOURCE_HOME: ${{ runner.temp }}/dsh-source-home-tests
  DSH_DESKTOP_CC_SWITCH_HOME: ${{ runner.temp }}/cc-switch-home-tests

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - name: Verify release version and generated contract
        run: |
          pnpm versions
          pnpm bindings
          test -z "$(git status --short --untracked-files=all -- src/platform/generated/bindings.ts)"
      - name: Verify React application
        run: |
          pnpm format:check
          pnpm lint
          pnpm test
          pnpm deadcode
          pnpm cloudflare:check
          pnpm build
      - name: Verify Rust core and Tauri adapter
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Verify pinned runtime transports
        run: cargo run --quiet -p dsh-core --example release_check

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: macos-arm64
            paths: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz*
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: macos-x64
            paths: |
              target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz*
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
            paths: |
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
    runs-on: ${{ matrix.runner }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Require the Tauri updater trust root
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          node scripts/write-release-config.mjs "$RUNNER_TEMP/tauri.release.json"
      - name: Build signed updater artifacts
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        with:
          args: --config "${{ runner.temp }}/tauri.release.json" --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Build and publish release artifacts
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: DSH Launcher v__VERSION__
          releaseBody: See the repository changelog and installation guide for this release.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: --config "${{ runner.temp }}/tauri.release.json" --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Require signed updater artifacts
        shell: bash
        run: |
          shopt -s nullglob
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            installers=(target/${{ matrix.target }}/release/bundle/nsis/*.exe)
            signatures=(target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig)
            test "${#installers[@]}" -gt 0
            test "${#signatures[@]}" -eq "${#installers[@]}"
          else
            dmgs=(target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
            archives=(target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz)
            signatures=(target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig)
            test "${#dmgs[@]}" -gt 0
            test "${#archives[@]}" -gt 0
            test "${#signatures[@]}" -eq "${#archives[@]}"
          fi

      - name: Smoke installed package
        shell: bash
        run: |
          shopt -s nullglob
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            installer=(target/${{ matrix.target }}/release/bundle/nsis/*.exe)
            install_root="$RUNNER_TEMP/dsh-installer-smoke"
            install_root_windows="$(cygpath -w "$install_root")"
            "${installer[0]}" /S "/D=$install_root_windows"
            executable="$(find "$install_root" -type f -iname '*.exe' ! -iname 'uninstall.exe' -print -quit)"
            test -n "$executable"
            "$executable" --desktop-version
            "$executable" --check
            uninstaller="$(find "$install_root" -type f -iname 'uninstall.exe' -print -quit)"
            if [[ -n "$uninstaller" ]]; then "$uninstaller" /S; fi
          else
            dmg=(target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
            mount_point="$RUNNER_TEMP/dsh-dmg-smoke"
            mkdir -p "$mount_point"
            cleanup() { hdiutil detach "$mount_point" -quiet || true; }
            trap cleanup EXIT
            hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "${dmg[0]}"
            app_bundle="$(find "$mount_point" -maxdepth 2 -type d -name '*.app' -print -quit)"
            test -n "$app_bundle"
            codesign --verify --deep --strict --verbose=2 "$app_bundle"
            executable="$(find "$mount_point" -path '*/Contents/MacOS/dsh-launcher' -type f -print -quit)"
            test -n "$executable"
            "$executable" --desktop-version
            "$executable" --check
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-launcher-${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  verify-release:
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-launcher-*
          path: ${{ runner.temp }}/release-artifacts
          merge-multiple: false
      - name: Create and upload the complete updater manifest
        run: |
          mkdir -p "$RUNNER_TEMP/generated-manifest"
          node scripts/create-updater-manifest.mjs "$RUNNER_TEMP/release-artifacts" "$RUNNER_TEMP/generated-manifest/latest.json"
          gh release view "$GITHUB_REF_NAME" --json assets > "$RUNNER_TEMP/generated-manifest/release-assets.json"
          node scripts/check-updater-manifest.mjs "$RUNNER_TEMP/generated-manifest/latest.json" "$RUNNER_TEMP/generated-manifest/release-assets.json"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/generated-manifest/latest.json" --clobber
      - name: Verify the uploaded updater manifest
        run: |
          mkdir -p "$RUNNER_TEMP/updater-manifest"
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$RUNNER_TEMP/updater-manifest"
          gh release view "$GITHUB_REF_NAME" --json assets > "$RUNNER_TEMP/updater-manifest/release-assets.json"
          node scripts/check-updater-manifest.mjs "$RUNNER_TEMP/updater-manifest/latest.json" "$RUNNER_TEMP/updater-manifest/release-assets.json"
